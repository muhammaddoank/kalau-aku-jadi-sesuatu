<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipbook</title>
<style>
:root{
  --bg1:#e4fbf3;--bg2:#e2eeff;--ink:#12303a;--muted:#5b7a85;
  --a1:#00b894;--a2:#0984e3;--glass:rgba(255,255,255,.7);--bd:rgba(255,255,255,.9);
  --sh:0 12px 32px rgba(9,132,227,.16);--page:#fff;
}
@media(prefers-color-scheme:dark){:root{
  --bg1:#0a1d22;--bg2:#0c1a2e;--ink:#e6f6f2;--muted:#8fb0b8;
  --glass:rgba(18,40,48,.7);--bd:rgba(255,255,255,.1);--sh:0 12px 32px rgba(0,0,0,.45);--page:#1b2a30;
}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(60vmax 60vmax at 0% 0%,rgba(0,184,148,.22),transparent 60%),
    radial-gradient(55vmax 55vmax at 100% 100%,rgba(9,132,227,.22),transparent 60%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.glass{background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 14px 0;padding:10px 16px;border-radius:18px}
h1{font-size:clamp(15px,2.4vw,20px);font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;min-width:0}
h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.btn{border:0;cursor:pointer;color:var(--ink);background:transparent;font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:40px;min-width:40px;padding:0 12px;border-radius:12px;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{background:rgba(0,184,148,.15)}
.btn:active{transform:scale(.94)}
.btn.pri{color:#fff;font-weight:600;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 16px rgba(0,184,148,.35)}
.btn.pri:hover{filter:brightness(1.06)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stage{flex:1;min-height:0;padding:10px 14px;position:relative}
#book{width:100%;height:100%}
.page{background:var(--page);overflow:hidden;position:relative}
.page img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .4s;user-select:none;-webkit-user-drag:none}
.page.ok img{opacity:1}
.page:not(.ok)::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(0,184,148,.16) 50%,transparent 70%) 0 0/250% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
#bar{display:flex;align-items:center;gap:8px;margin:0 auto 14px;padding:8px 12px;border-radius:20px;width:min(720px,calc(100% - 28px))}
#range{flex:1;min-width:60px;accent-color:var(--a1);height:28px;cursor:pointer}
.pg{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
#num{width:54px;height:36px;border-radius:10px;border:1px solid var(--bd);background:rgba(127,127,127,.12);color:var(--ink);text-align:center;font:inherit;font-weight:600}
#num:focus{outline:2px solid var(--a1)}
@media(max-width:560px){.hide-s{display:none}header{margin:8px 8px 0}#stage{padding:6px 6px}#bar{gap:4px;margin-bottom:8px}}
</style>
</head>
<body>

<header class="glass">
  <h1><div class="logo"><svg style="stroke:#fff" viewBox="0 0 24 24"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.500-1.500-6-1.500-10 .5-4-2-7.500-2-10-.5z"/><path d="M12 6v13.500"/></svg></div><span id="title">Flipbook</span></h1>
</header>

<main id="stage"><div id="book"></div></main>

<nav id="bar" class="glass" aria-label="Navigasi halaman">
  <button class="btn" id="first" title="Halaman pertama" aria-label="Halaman pertama"><svg viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
  <button class="btn" id="prev" title="Sebelumnya" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <input id="range" type="range" min="1" value="1" aria-label="Geser halaman">
  <div class="pg"><input id="num" type="number" min="1" inputmode="numeric" aria-label="Nomor halaman"><span>/ <b id="tot"></b></span></div>
  <button class="btn" id="next" title="Berikutnya" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button class="btn hide-s" id="fs" title="Layar penuh" aria-label="Layar penuh"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
/* ====== PENGATURAN: sesuaikan di sini ====== */
const CONFIG = {
  title: 'Kalau Aku Jadi Sesuatu',
  total: 168,                       // jumlah halaman
  path: n => `pages/${String(n).padStart(3,'0')}.webp`,  // pages/001.webp ... pages/168.webp
  w: 800, h: 1131                   // rasio halaman (800x1131 = A4)
};
/* =========================================== */

const T = CONFIG.total, $ = id => document.getElementById(id);
document.title = CONFIG.title; $('title').textContent = CONFIG.title;
$('tot').textContent = T;
$('range').max = T; $('num').max = T;

const book = $('book'), imgs = [];
for (let i = 1; i <= T; i++) {
  const d = document.createElement('div'); d.className = 'page';
  if (i === 1 || i === T) d.dataset.density = 'hard';
  const im = document.createElement('img'); im.alt = 'Halaman ' + i; im.draggable = false; im.decoding = 'async';
  d.appendChild(im); book.appendChild(d); imgs.push(im);
}

// Muat gambar hanya di sekitar halaman yang sedang dibuka (lazy load)
function load(i) {
  for (let j = Math.max(0, i - 3); j <= Math.min(T - 1, i + 7); j++) {
    const im = imgs[j];
    if (im.dataset.l) continue;
    im.dataset.l = 1;
    im.onload = () => im.parentNode.classList.add('ok');
    im.src = CONFIG.path(j + 1);
  }
}

const hashPage = parseInt(location.hash.slice(1), 10);
const start = Math.min(T - 1, Math.max(0, (hashPage || 1) - 1));

const pf = new St.PageFlip(book, {
  width: CONFIG.w, height: CONFIG.h, size: 'stretch',
  minWidth: 240, maxWidth: 1100, minHeight: 340, maxHeight: 1560,
  showCover: true, maxShadowOpacity: .45, flippingTime: 700,
  mobileScrollSupport: false, startPage: start
});
pf.loadFromHtml(document.querySelectorAll('.page'));

function update(i) {
  $('range').value = i + 1; $('num').value = i + 1;
  history.replaceState(null, '', '#' + (i + 1));
  load(i);
}
pf.on('flip', e => update(e.data));
update(start);

const go = n => { n = Math.min(T, Math.max(1, n | 0)); pf.turnToPage(n - 1); update(n - 1); };
$('prev').onclick = () => pf.flipPrev();
$('next').onclick = () => pf.flipNext();
$('first').onclick = () => go(1);
$('range').oninput = e => $('num').value = e.target.value;
$('range').onchange = e => go(+e.target.value);
$('num').onchange = e => go(+e.target.value);

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') pf.flipNext();
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') pf.flipPrev();
  else if (e.key === 'Home') go(1);
  else if (e.key === 'End') go(T);
  else if (e.key === 'f') $('fs').click();
});

$('fs').onclick = () => document.fullscreenElement
  ? document.exitFullscreen()
  : document.documentElement.requestFullscreen?.();
</script>
</body>
</html>
